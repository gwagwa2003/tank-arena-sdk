[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tank-arena-sdk"
version = "0.3.0"
description = "Tank Arena SDK: the game engine, the 91-number observation, a training environment, model export and the site's API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = ["torch>=2.1", "pytest"]

[project.scripts]
tank-arena = "tank_arena.cli:main"

[tool.setuptools]
packages = ["tank_arena"]
